services:
  db:
    image: postgres:15
    container_name: cinema_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinema_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: cinema_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: db
        DB_NAME: cinema_db
        DATABASE_URL: postgresql://postgres:postgres@db:5432/cinema_db
    volumes:
      - ./static/posters:/app/static/posters
      - ./logs:/app/logs
      - ./backups:/app/backups
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinema_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: